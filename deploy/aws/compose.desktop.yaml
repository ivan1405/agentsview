services:
  net:
    image: alpine/socat@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
    command: ["TCP4-LISTEN:9297,bind=127.0.0.1,reuseaddr,fork", "TCP4:host.docker.internal:9297,connect-timeout=5"]
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    network_mode: service:net

  web:
    network_mode: service:net
    environment:
      AGENTSVIEW_HOST: 0.0.0.0
    command:
      - >-
        umask 077;
        printf '%s' "$$AGENTSVIEW_CONFIG_TOML" > /data/config.toml &&
        exec /usr/local/bin/agentsview replica pg serve
        --host 0.0.0.0 --port 8080 --public-url http://localhost:8080

  collector:
    network_mode: service:net
